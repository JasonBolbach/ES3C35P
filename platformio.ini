; Development project for the ES3C35P library: builds examples/FingerPaint
; against the library header in src/. Ignored when this repo is used via lib_deps.
;
; ES3C35P - ESP32-S3 + 3.5" 320x480 ST77922 IPS LCD over QSPI
;   MCU     : ESP32-S3R8 (8 MB OPI PSRAM), 16 MB QIO flash
;   Display : ST77922, QSPI (CS 10, SCLK 12, D0 11, D1 13, D2 14, D3 9), BL 41, RST not wired
;   Touch   : integrated in ST77922 package, I2C 0x55 (SDA 38, SCL 39, RST 48, INT 47)
;
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = examples/FingerPaint

[env:es3c35p]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

board_build.flash_mode = qio
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi   ; OPI PSRAM - wrong mode = garbage from PSRAM sprites
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

build_flags =
    -I src
    -DARDUINO_USB_CDC_ON_BOOT=1     ; Serial -> native USB (USB-Serial/JTAG)
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1

lib_deps =
    lovyan03/LovyanGFX@^1.3.0       ; needs Panel_ST77916 (QSPI) which Panel_ST77922 builds on
